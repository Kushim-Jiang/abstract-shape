<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽构标注管理</title>
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>
<div id="app">
  <header class="main-header">
    <div class="header-row">
      <span class="site-title">抽构标注管理</span>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="write">写作</button>
        <button class="nav-btn" data-view="chars">广义汉字</button>
        <button class="nav-btn" data-view="browse-ob">甲骨文</button>
        <button class="nav-btn" data-view="browse-bi">金文</button>
        <button class="nav-btn" data-view="papers">参考文献</button>
        <button class="nav-btn" data-view="extra">未编码字</button>
      </nav>
      <button id="theme-toggle" class="icon-btn" title="切换主题">☀️</button>
    </div>
  </header>

  <main>
    <!-- ═══ 抽构视图（abstract shape + 分析） ═══ -->
    <div id="view-write" class="view active write-view">
      <!-- 左侧：汉字列表（按 Unicode 区段分组） -->
      <aside class="write-sidebar" id="pane-left">
        <div class="ws-head">
          <input type="text" id="doc-search">
          <div class="ws-actions">
            <button id="doc-refresh-btn" class="btn-sm">⟳ 刷新</button>
          </div>
          <div class="ws-stat">
            <span id="doc-count" class="badge"></span>
              <span id="doc-verify-total" class="badge bad" style="display:none"></span>
              <span id="doc-dirty" class="dirty-dot" style="display:none">●</span>
            </div>
        </div>
        <div class="block-filter">
          <button class="blk-chip active" data-block="__all__">全部</button>
          <button class="blk-chip done" data-block="__done__">✓ 已写</button>
          <button id="doc-first-blank" class="blk-chip blank">▶ 未写</button>
          <button id="doc-first-issue" class="blk-chip issue" title="跳到第一处核验问题">⚠ 核验</button>
          <div id="block-chips" class="block-chips"></div>
        </div>
        <div id="doc-list" class="doc-list"></div>
        <div id="doc-pager" class="doc-pager"></div>
      </aside>

      <div class="v-split" id="split-left" title="拖动调整宽度"></div>

      <!-- 右侧：抽构 + 分析 -->
      <section class="write-main" id="write-main">
        <!-- 空状态 -->
        <div id="write-empty" class="write-empty">
          <div class="we-glyph">构</div>
        </div>

        <!-- 编辑器主体 -->
        <div id="write-editor" class="write-editor" style="display:none">
          <!-- 工具栏 -->
          <div class="we-toolbar">
            <button id="doc-prev-btn" class="btn-nav">◀</button>
            <span id="doc-nav-label" class="doc-nav-label"></span>
            <button id="doc-next-btn" class="btn-nav">▶</button>
            <div class="we-switch">
              <button class="we-switch-btn active" id="sw-edit">编辑</button>
              <button class="we-switch-btn" id="sw-preview">预览</button>
            </div>
            <span id="doc-head-char" class="doc-head-char"></span>
            <span id="doc-head-block" class="doc-head-block"></span>
            <span class="we-spacer"></span>
            <span id="doc-verify-state" class="verify-state"></span>
            <span id="doc-save-state" class="save-state"></span>
          </div>

          <!-- 左右分栏：左＝编辑/预览（可切换），右＝参考资料 -->
          <div class="we-panes" id="doc-panes">
            <!-- ── 左：一个框，编辑 / 预览 切换 ── -->
            <div class="we-col-left">
              <div class="we-stage" id="we-stage">
                <div class="we-pane we-pane-edit active" id="pane-edit">
                  <div id="note-forms" class="note-forms"></div>
                </div>
                <div class="we-pane we-pane-preview" id="pane-preview">
                  <article id="doc-preview" class="markdown-body"></article>
                </div>
              </div>
            </div>

            <div class="v-split" id="split-right" title="拖动调整宽度"></div>

            <!-- ── 右：参考资料 ── -->
            <aside class="we-col-right" id="pane-right">
              <div class="ref-tabs">
                <button class="ref-tab active" data-panel="refs">文献<span id="tab-refs-badge" class="tab-badge" style="display:none"></span></button>
                <button class="ref-tab" data-panel="materials">资料</button>
                <button class="ref-tab" data-panel="verify">核验<span id="tab-verify-badge" class="tab-badge" style="display:none"></span></button>
              </div>
              <div class="ref-panels">
                <div class="ref-panel active" id="panel-refs"></div>
                <div class="ref-panel" id="panel-verify"></div>
                <div class="ref-panel" id="panel-materials">
                  <section class="mat-sec" id="sec-sheet">
                    <h4 class="mat-h">抽构表</h4>
                    <div class="mat-body" id="panel-sheet"></div>
                  </section>
                  <section class="mat-sec" id="sec-guangyun">
                    <h4 class="mat-h">广韵</h4>
                    <div class="mat-body" id="panel-guangyun"></div>
                  </section>
                  <section class="mat-sec" id="sec-ies">
                    <h4 class="mat-h">IES</h4>
                    <div class="mat-body" id="panel-ies"></div>
                  </section>
                  <section class="mat-sec" id="sec-lexicon">
                    <h4 class="mat-h">词表</h4>
                    <div class="mat-body" id="panel-lexicon"></div>
                  </section>
                </div>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </div>
    <!-- ═══ 广义汉字视图（查询列表） ═══ -->
    <div id="view-chars" class="view">
      <div class="toolbar">
        <input type="text" id="char-search">
        <button id="char-search-btn" class="btn-primary">搜索</button>
        <button id="first-unanno-btn" class="btn-accent">▶ 第一个未标</button>
        <span id="char-count" class="badge"></span>
      </div>
      <div id="char-list" class="char-grid"></div>
      <div id="char-pagination" class="pagination"></div>
    </div>

    <!-- ═══ 甲骨文视图（查询列表 + 汉字字形标注） ═══ -->
    <div id="view-browse-ob" class="view">
      <div class="toolbar">
        <input type="text" id="ob-search" placeholder="按编号或汉字字形搜索，如 0001">
        <button id="ob-search-btn" class="btn-primary">搜索</button>
        <span id="ob-count" class="badge"></span>
        <span class="toolbar-hint">字形下方点 ＋ 标汉字字形，点 × 删除</span>
      </div>
      <div id="ob-list" class="char-grid"></div>
      <div id="ob-pagination" class="pagination"></div>
    </div>

    <!-- ═══ 金文视图（查询列表 + 汉字字形标注） ═══ -->
    <div id="view-browse-bi" class="view">
      <div class="toolbar">
        <input type="text" id="bi-search" placeholder="按编号或汉字字形搜索，如 00001">
        <button id="bi-search-btn" class="btn-primary">搜索</button>
        <span id="bi-count" class="badge"></span>
        <span class="toolbar-hint">字形下方点 ＋ 标汉字字形，点 × 删除</span>
      </div>
      <div id="bi-list" class="char-grid"></div>
      <div id="bi-pagination" class="pagination"></div>
    </div>

    <div id="view-papers" class="view">
      <div class="toolbar">
        <input type="text" id="paper-search">
        <span id="paper-count" class="badge"></span>
      </div>
      <div id="paper-list"></div>
    </div>

    <div id="view-extra" class="view">
      <div class="toolbar">
        <h3>未编码字</h3>
        <button id="extra-add-btn" class="btn-primary">+ 新增</button>
      </div>
      <div id="extra-list"></div>
    </div>

  </main>

  <!-- 新增未编码字弹窗 -->
  <div id="extra-add-overlay" class="overlay" style="display:none">
    <div class="overlay-content">
      <button class="close-btn" id="extra-add-close">&times;</button>
      <h3>新增未编码字</h3>
      <form id="extra-form">
        <label>抽构 (con)</label>
        <input type="text" id="extra-con">
        <label>参考抽构 (ref)</label>
        <input type="text" id="extra-ref">
        <label>注释 (comm)</label>
        <textarea id="extra-comm" rows="3"></textarea>
        <button type="submit" class="btn-primary">保存</button>
      </form>
    </div>
  </div>
</div>
<script src="markdown.js?v=16"></script>
<script src="format.js?v=1"></script>
<script src="images.js?v=1"></script>
<script src="writer.js?v=45"></script>
<script src="refs.js?v=13"></script>
<script src="app.js?v=12"></script>
<script src="typography.js?v=5"></script>
</body>
</html>
